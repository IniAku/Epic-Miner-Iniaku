# Build & rilis epic-miner edisi epic.iniaku.my.id.
# - push ke branch / PR : build Linux + Windows, paket jadi artifact
# - push tag v*         : sama, lalu paket diunggah ke GitHub Releases
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply submodule patches
        run: iniaku/apply-submodule-patches.sh
      - name: Version
        id: v
        run: echo "version=$(iniaku/version.sh)" >> "$GITHUB_OUTPUT"
      # Ubuntu 20.04 (glibc 2.31) supaya paket jalan di HiveOS & Ubuntu 20.04+
      - name: Build (Ubuntu 20.04 container) & package
        run: |
          mkdir -p "$HOME/.cargo/registry"
          if ! ./iniaku/build-linux-release.sh "${{ steps.v.outputs.version }}" > build.log 2>&1; then
            cat build.log
            msg=$( (grep -nE "error|fatal|not found|denied" build.log | head -25; echo ----; tail -60 build.log) | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=linux build failed::$msg"
            exit 1
          fi
          cat build.log
      - name: HiveOS custom-miner package
        run: |
          v="${{ steps.v.outputs.version }}"
          ./iniaku/package-hiveos.sh "dist/epic-miner-iniaku-$v-linux-x64-opencl.tar.gz" "$v"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.sha256

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Submodule patches
        shell: bash
        run: iniaku/apply-submodule-patches.sh
      # ProgPoW (progpow-rust/pp_full, C++): Boost from vcpkg (static, /MT) instead of Hunter.
      - name: Boost (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install boost-system:x64-windows-static boost-algorithm:x64-windows-static boost-exception:x64-windows-static boost-functional:x64-windows-static boost-multiprecision:x64-windows-static boost-throw-exception:x64-windows-static
          $root = $env:VCPKG_INSTALLATION_ROOT -replace '\\','/'
          "CMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_TARGET_TRIPLET=x64-windows-static" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROGPOW_CMAKE_GENERATOR=Visual Studio 17 2022" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(iniaku/version.sh)" >> "$GITHUB_OUTPUT"
      - name: OpenCL SDK (OpenCL.lib)
        shell: pwsh
        run: |
          $url = "https://github.com/KhronosGroup/OpenCL-SDK/releases/download/v2023.12.14/OpenCL-SDK-v2023.12.14-Win-x64.zip"
          Invoke-WebRequest $url -OutFile ocl.zip
          Expand-Archive ocl.zip -DestinationPath C:\ocl
          $lib = (Get-ChildItem C:\ocl -Recurse -Filter OpenCL.lib | Select-Object -First 1).DirectoryName
          "OCL_LIB_DIR=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          $inc = (Get-ChildItem C:\ocl -Recurse -Filter cl.h | Where-Object { $_.Directory.Name -eq 'CL' } | Select-Object -First 1).Directory.Parent.FullName
          "OpenCL_INCLUDE_DIR=$($inc -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OpenCL_LIBRARY=$((Join-Path $lib 'OpenCL.lib') -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: dtolnay/rust-toolchain@stable
      # Plugin CPU/CUDA tromp tidak dibangun di MSVC (CMake: IF NOT MSVC) → paket Windows = OpenCL.
      - name: Build
        shell: bash
        run: |
          # crt-static: runtime C ditanam di exe/plugin — tanpa ini butuh VC++ 2015-2022
          # Redistributable (vcruntime140.dll), yg tidak ada di banyak PC (exit 0xC0000135).
          export RUSTFLAGS="-L native=$OCL_LIB_DIR -C target-feature=+crt-static"
          export INIAKU_VERSION="${{ steps.v.outputs.version }}"
          # Error compiler juga dikirim sbg anotasi (bisa dibaca tanpa login, log job tidak).
          build() {
            if ! "$@" > build.log 2>&1; then
              cat build.log
              # Satu anotasi berisi baris error + 60 baris terakhir (%0A = baris baru).
              msg=$( (grep -niE "error|fatal|LINK" build.log | grep -vi "warning" | head -25; echo ----; sed -n '/failed to run custom build command/,/^warning: build failed\|^error: could not compile/p' build.log | grep -vE "^\s*(running|cargo:|-- )" | grep -iE "error|fatal|could not|not found|missing|undefined|unresolved|\.cpp|\.h\b|LNK|C[0-9]{4}" | head -60; echo ----; tail -25 build.log) | sed 's/\x1b\[[0-9;]*m//g' | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=build failed::$msg"
              exit 1
            fi
            cat build.log
          }
          # opencl = Cuckoo OpenCL plugin + ProgPoW OpenCL (for iniaku-miner's GPU engine)
          build cargo build --release --no-default-features --features cpu,opencl,cuckoo_miner/no-plugin-build
          build cargo build --release -p ocl_cuckatoo
      - name: Package
        shell: bash
        run: iniaku/package-windows.sh "${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          body: |
            epic-miner — epic.iniaku.my.id edition (Cuckatoo19 / Cuckoo for Epic Cash).
            Mines only to the epic.iniaku.my.id pool (region auto / id / us / au).

            - Linux OpenCL (AMD, also NVIDIA) and Linux CUDA (NVIDIA): glibc 2.31+ (HiveOS, Ubuntu 20.04+)
            - Windows OpenCL (AMD and NVIDIA)

            Set your address in epic-miner.toml: stratum_server_login = "<address>.<worker>"
            See README.txt in the package.
